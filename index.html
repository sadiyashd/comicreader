<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; height: 100vh; overflow: hidden; }
    
    /* Layout Screens */
    #libraryScreen, #readerScreen { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    #libraryScreen { padding: 20px; background: #1a1a1a; overflow-y: auto; }
    #readerScreen { display: none; position: relative; background: #000; }

    /* Library Cards */
    .comic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 15px; }
    .comic-card { background: #2a2a2a; border-radius: 8px; padding: 12px; cursor: pointer; border: 1px solid #333; }
    .comic-card:hover { background: #353535; }
    .progress-bar-wrap { background: #444; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .progress-bar-fill { background: #4caf50; height: 100%; width: 0%; }

    /* Reader Navbar Controls */
    .nav-menu { position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); display: flex; gap: 15px; padding: 10px 20px; align-items: center; z-index: 100; }
    .nav-menu.hidden { display: none; }
    button { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #555; }
    .slider-group { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    /* Reader Viewport */
    #readerViewport { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; width: 100%; height: 100%; }
    #imageContainer { display: flex; width: 100%; height: 100%; justify-content: center; align-items: center; transform-origin: center center; }

    /* Page Containers & Scaling */
    .page-wrapper { display: flex; justify-content: center; align-items: center; height: 100%; overflow: hidden; flex: 1; }
    .page-wrapper img { max-height: 100%; max-width: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <!-- LIBRARY SCREEN -->
  <div id="libraryScreen">
    <h2>Library</h2>
    <div class="comic-grid" id="comicGrid"></div>
  </div>

  <!-- READER SCREEN -->
  <div id="readerScreen">
    <div class="nav-menu" id="navMenu">
      <button id="menuLibraryBtn">← Library</button>
      <button id="prevBtn">Prev</button>
      <button id="nextBtn">Next</button>
      <button id="toggleModeBtn">Mode: Single</button>
      
      <div class="slider-group">
        <label>Stretch X:</label>
        <input type="range" id="scaleXInput" min="50" max="150" value="100">
      </div>
      <div class="slider-group">
        <label>Stretch Y:</label>
        <input type="range" id="scaleYInput" min="50" max="150" value="100">
      </div>
    </div>

    <div id="readerViewport">
      <div id="imageContainer"></div>
    </div>
  </div>

  <script>
    // --- MOCK DATABASE ---
    const MOCK_FILES = [
      { name: "Comic_Alpha.cbz", size: 102400, pageCount: 12 },
      { name: "Comic_Beta.cbz", size: 204800, pageCount: 8 }
    ];

    // --- APPLICATION STATE ---
    let currentFile = null;
    let currentArchive = null;
    let currentPageIndex = 0;
    let isTwoPageMode = false;

    let objectURLsInUse = [];
    let preloadedBlobs = {}; // Holds blob URLs indexed by page number
    let cardsByKey = {};

    // --- DOM REFERENCES ---
    const libraryScreen = document.getElementById('libraryScreen');
    const readerScreen = document.getElementById('readerScreen');
    const comicGrid = document.getElementById('comicGrid');
    const navMenu = document.getElementById('navMenu');
    const menuLibraryBtn = document.getElementById('menuLibraryBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const scaleXInput = document.getElementById('scaleXInput');
    const scaleYInput = document.getElementById('scaleYInput');
    const imageContainer = document.getElementById('imageContainer');

    // --- UTILITIES ---
    function comicKey(file) {
      return `${file.name}_${file.size}`;
    }

    function loadProgress() {
      if (!currentFile) return 0;
      return parseInt(localStorage.getItem(`progress_${comicKey(currentFile)}`) || '0', 10);
    }

    function saveProgress(pageIndex) {
      if (!currentFile) return;
      localStorage.setItem(`progress_${comicKey(currentFile)}`, pageIndex.toString());
    }

    // Generator mimicking an image fetch/unpack returning SVG Data URIs with page numbers
    function fetchMockPageBlob(pageIndex) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
        <rect width="100%" height="100%" fill="${currentFile.name.includes('Alpha') ? '#2b4c7e' : '#7e2b4c'}"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-size="48">
          ${currentFile.name} - Page ${pageIndex + 1}
        </text>
      </svg>`;
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      return URL.createObjectURL(blob);
    }

    // --- CACHE & OBJECT URL CLEANUP ---
    function cleanupObjectURLs() {
      objectURLsInUse.forEach(url => URL.revokeObjectURL(url));
      objectURLsInUse = [];
    }

    function purgePreloadCache() {
      // Revoke and clear any pending preloaded blobs
      Object.values(preloadedBlobs).forEach(url => URL.revokeObjectURL(url));
      preloadedBlobs = {};
    }

    // --- PRELOAD ENGINE ---
    function prefetchPages(centerIndex) {
      const pagesToLoad = [centerIndex + 1, centerIndex + 2];
      
      pagesToLoad.forEach(idx => {
        if (idx < currentArchive.pageCount && !preloadedBlobs[idx]) {
          preloadedBlobs[idx] = fetchMockPageBlob(idx);
        }
      });
    }

    function getPageURL(pageIndex) {
      if (preloadedBlobs[pageIndex]) {
        const url = preloadedBlobs[pageIndex];
        delete preloadedBlobs[pageIndex]; // Consume from cache
        objectURLsInUse.push(url);
        return url;
      }
      const url = fetchMockPageBlob(pageIndex);
      objectURLsInUse.push(url);
      return url;
    }

    // --- STRETCH SETTINGS PERSISTENCE ---
    function loadComicSettings(file) {
      if (!file) return;
      const key = comicKey(file);
      const savedSettings = JSON.parse(localStorage.getItem(`stretch_${key}`) || '{}');

      const scaleX = savedSettings.scaleX !== undefined ? savedSettings.scaleX : 100;
      const scaleY = savedSettings.scaleY !== undefined ? savedSettings.scaleY : 100;

      scaleXInput.value = scaleX;
      scaleYInput.value = scaleY;
      applyStretch(scaleX, scaleY);
    }

    function saveComicSettings() {
      if (!currentFile) return;
      const key = comicKey(currentFile);
      const settings = {
        scaleX: scaleXInput.value,
        scaleY: scaleYInput.value
      };
      localStorage.setItem(`stretch_${key}`, JSON.stringify(settings));
    }

    function applyStretch(scaleX, scaleY) {
      imageContainer.style.transform = `scale(${scaleX / 100}, ${scaleY / 100})`;
    }

    scaleXInput.addEventListener('input', () => {
      applyStretch(scaleXInput.value, scaleYInput.value);
      saveComicSettings();
    });

    scaleYInput.addEventListener('input', () => {
      applyStretch(scaleXInput.value, scaleYInput.value);
      saveComicSettings();
    });

    // --- TWO-PAGE LANDSCAPE ASPECT SNAPPING ---
    function updateLandscapeTwoPageLayout(imgLeft, imgRight) {
      if (!imgLeft || !imgRight) return;

      const adjustFlex = () => {
        if (!imgLeft.naturalWidth || !imgRight.naturalWidth) return;
        const aspectLeft = imgLeft.naturalWidth / imgLeft.naturalHeight;
        const aspectRight = imgRight.naturalWidth / imgRight.naturalHeight;
        
        const combinedAspect = aspectLeft + aspectRight;
        const leftWidthPercent = (aspectLeft / combinedAspect) * 100;
        const rightWidthPercent = (aspectRight / combinedAspect) * 100;

        if (imgLeft.parentElement) imgLeft.parentElement.style.flex = `0 0 ${leftWidthPercent}%`;
        if (imgRight.parentElement) imgRight.parentElement.style.flex = `0 0 ${rightWidthPercent}%`;
      };

      if (imgLeft.complete && imgRight.complete) {
        adjustFlex();
      } else {
        imgLeft.onload = adjustFlex;
        imgRight.onload = adjustFlex;
      }
    }

    // --- READER CORE RENDERING ---
    function renderPages() {
      cleanupObjectURLs();
      imageContainer.innerHTML = '';

      const createPageElement = (pageIdx) => {
        const wrap = document.createElement('div');
        wrap.className = 'page-wrapper';
        const img = document.createElement('img');
        img.src = getPageURL(pageIdx);
        wrap.appendChild(img);
        return { wrap, img };
      };

      if (!isTwoPageMode || currentPageIndex >= currentArchive.pageCount - 1) {
        // Single Page View
        const { wrap } = createPageElement(currentPageIndex);
        imageContainer.appendChild(wrap);
      } else {
        // Two Page View
        const left = createPageElement(currentPageIndex);
        const right = createPageElement(currentPageIndex + 1);

        imageContainer.appendChild(left.wrap);
        imageContainer.appendChild(right.wrap);

        updateLandscapeTwoPageLayout(left.img, right.img);
      }

      saveProgress(currentPageIndex);
      prefetchPages(currentPageIndex);
    }

    // --- NAVIGATION LOGIC ---
    function openComic(file) {
      // Flush residual state and caches from previous sessions
      cleanupObjectURLs();
      purgePreloadCache();

      currentFile = file;
      currentArchive = { pageCount: file.pageCount };
      currentPageIndex = loadProgress();

      loadComicSettings(currentFile);

      libraryScreen.style.display = 'none';
      readerScreen.style.display = 'flex';
      renderPages();
    }

    menuLibraryBtn.addEventListener('click', () => {
      // Fix: Clear preloadedBlobs and active URLs to stop cross-comic image leaks
      cleanupObjectURLs();
      purgePreloadCache();

      readerScreen.style.display = 'none';
      libraryScreen.style.display = 'flex';

      // Update card UI progress indicators
      if (currentFile && cardsByKey[comicKey(currentFile)]) {
        const card = cardsByKey[comicKey(currentFile)];
        addProgressBar(card, comicKey(currentFile), currentArchive ? currentArchive.pageCount : 0, loadProgress());
      }

      // Reset active refs
      currentFile = null;
      currentArchive = null;
    });

    prevBtn.addEventListener('click', () => {
      const step = isTwoPageMode ? 2 : 1;
      if (currentPageIndex - step >= 0) {
        currentPageIndex -= step;
        renderPages();
      } else if (currentPageIndex > 0) {
        currentPageIndex = 0;
        renderPages();
      }
    });

    nextBtn.addEventListener('click', () => {
      const step = isTwoPageMode ? 2 : 1;
      if (currentPageIndex + step < currentArchive.pageCount) {
        currentPageIndex += step;
        renderPages();
      }
    });

    toggleModeBtn.addEventListener('click', () => {
      isTwoPageMode = !isTwoPageMode;
      toggleModeBtn.innerText = `Mode: ${isTwoPageMode ? 'Two-Page' : 'Single'}`;
      renderPages();
    });

    // --- LIBRARY SETUP ---
    function addProgressBar(cardEl, key, totalPages, currentPage) {
      let wrap = cardEl.querySelector('.progress-bar-wrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.className = 'progress-bar-wrap';
        const fill = document.createElement('div');
        fill.className = 'progress-bar-fill';
        wrap.appendChild(fill);
        cardEl.appendChild(wrap);
      }
      const fill = wrap.querySelector('.progress-bar-fill');
      const pct = totalPages > 0 ? Math.min(100, Math.round(((currentPage + 1) / totalPages) * 100)) : 0;
      fill.style.width = `${pct}%`;
    }

    function initLibrary() {
      MOCK_FILES.forEach(file => {
        const key = comicKey(file);
        const card = document.createElement('div');
        card.className = 'comic-card';
        card.innerHTML = `<strong>${file.name}</strong><br><small>${file.pageCount} Pages</small>`;
        
        cardsByKey[key] = card;
        
        const savedPage = parseInt(localStorage.getItem(`progress_${key}`) || '0', 10);
        addProgressBar(card, key, file.pageCount, savedPage);

        card.addEventListener('click', () => openComic(file));
        comicGrid.appendChild(card);
      });
    }

    initLibrary();
  </script>
</body>
</html>
